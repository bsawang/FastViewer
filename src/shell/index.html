<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>FastViewer</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <div id="brand">FastViewer</div>
      <div id="controls">
        <div id="theme-picker" class="fv-theme">
          <button
            id="theme-trigger"
            class="fv-theme-trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="theme-menu"
            aria-label="皮肤配色"
            title="皮肤配色"
          >
            <svg class="fv-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.098 19.902a3.75 3.75 0 0 0 5.304 0l6.401-6.402M6.75 21A3.75 3.75 0 0 1 3 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 0 0 3.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88c.438-.439 1.15-.439 1.59 0l3.712 3.713c.44.44.44 1.152 0 1.59l-2.879 2.88M6.75 17.25h.008v.008H6.75v-.008Z" />
            </svg>
            <span id="theme-label">深空蓝</span>
            <svg class="fv-theme-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
          </button>
          <ul id="theme-menu" class="fv-theme-menu" role="listbox" aria-label="皮肤配色" hidden>
            <li id="theme-opt-midnight" class="fv-theme-option" role="option" data-theme="midnight" aria-selected="true"><span class="fv-swatch" aria-hidden="true"></span>深空蓝</li>
            <li id="theme-opt-obsidian" class="fv-theme-option" role="option" data-theme="obsidian" aria-selected="false"><span class="fv-swatch" aria-hidden="true"></span>曜石黑</li>
            <li id="theme-opt-moss" class="fv-theme-option" role="option" data-theme="moss" aria-selected="false"><span class="fv-swatch" aria-hidden="true"></span>墨绿</li>
            <li id="theme-opt-ember" class="fv-theme-option" role="option" data-theme="ember" aria-selected="false"><span class="fv-swatch" aria-hidden="true"></span>琥珀</li>
            <li id="theme-opt-dawn" class="fv-theme-option" role="option" data-theme="dawn" aria-selected="false"><span class="fv-swatch" aria-hidden="true"></span>晨雾</li>
          </ul>
        </div>
        <button id="btn-settings" class="fv-cmd" title="设置与关于" aria-label="设置与关于">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.241.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </button>
        <button id="btn-min" class="fv-cmd" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button id="btn-max" class="fv-cmd" title="最大化" aria-label="最大化">
          <svg class="ico-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          <svg class="ico-restore" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M4 4V2.5h5.5V8H8" /><rect x="2.5" y="4" width="5.5" height="5.5" rx="1" />
          </svg>
        </button>
        <button id="btn-close" class="fv-cmd" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>
    <main id="stage"></main>
    <div id="settings" class="fv-modal" hidden>
      <section
        class="fv-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <header class="fv-panel-head">
          <h2 id="settings-title">设置与关于</h2>
          <button id="settings-close" class="fv-icon-btn" title="关闭" aria-label="关闭">×</button>
        </header>
        <dl class="fv-about">
          <div><dt>版本</dt><dd id="about-app">—</dd></div>
          <div><dt>Electron</dt><dd id="about-electron">—</dd></div>
          <div><dt>Chromium</dt><dd id="about-chromium">—</dd></div>
        </dl>
        <p id="about-config" class="fv-config-path">—</p>
        <div class="fv-panel-actions">
          <button id="btn-reveal-config" type="button">打开配置目录</button>
          <button id="btn-reset-layout" type="button">恢复默认布局</button>
          <button id="btn-reset-prefs" type="button">清理全部偏好</button>
        </div>
        <p id="settings-toast" class="fv-toast" hidden></p>
      </section>
    </div>
    <script src="shell.js"></script>
  </body>
</html>
